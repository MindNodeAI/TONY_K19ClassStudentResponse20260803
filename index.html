        // --- Utilities for Audio ---
        function pcmToWav(pcmData, sampleRate = 24000) {
            const header = new ArrayBuffer(44);
            const view = new DataView(header);
            const dataLen = pcmData.length;
            
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLen, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLen, true);
            
            return new Blob([header, pcmData], { type: 'audio/wav' });
        }

            // --- AI & API Logic ---
            
            async callGemini(prompt, mode = 'text') {
                if (!this.state.apiKey) throw new Error("請先輸入 API Key");
                
                let url, payload;

                if (mode === 'audio') {
                    url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${this.state.apiKey}`;
                    payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } }
                        }
                    };
                } else {
                    url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${this.state.apiKey}`;
                    payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: mode === 'json' ? "application/json" : "text/plain" }
                    };
                }

                try {
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        const errorMsg = data.error?.message || `HTTP Error: ${res.status}`;
                        if (res.status === 400 && errorMsg.includes('API key not valid')) {
                            console.error("Invalid API Key detected. Purging.");
                            sessionStorage.removeItem('gemini_api_key');
                            this.state.apiKey = '';
                            document.getElementById('input-api-key').value = '';
                            this.updateApiStatus(false);
                            throw new Error("API Key 無效，已自動清除。請重新輸入正確的 Key。");
                        }
                        throw new Error(errorMsg);
                    }
                    
                    if (!data.candidates || data.candidates.length === 0) {
                        if (data.promptFeedback) {
                            console.warn("Safety Block:", data.promptFeedback);
                            throw new Error(`AI 生成被阻擋 (安全過濾)。請嘗試修改關鍵字。`);
                        }
                        throw new Error("AI 未回傳任何內容，請稍後再試。");
                    }

                    const candidate = data.candidates[0];
                    if (!candidate.content || !candidate.content.parts || candidate.content.parts.length === 0) {
                         throw new Error("AI 回傳格式異常 (無內容)。");
                    }

                    if (mode === 'audio') {
                        if(!candidate.content.parts[0].inlineData) throw new Error("TTS 生成失敗 (無音訊資料)");
                        return candidate.content.parts[0].inlineData.data;
                    } else {
                        return candidate.content.parts[0].text;
                    }
                } catch (e) { 
                    console.error("Gemini API Error:", e);
                    throw e; 
                }

            async playAudio(text, id) {
                if (!text || text.length < 5) return alert("內容過短，無法語音導讀");
                this.setLoading(true, '✨ AI 正在錄製語音導讀 (長文模式)...');
                
                try {
                    const cleanText = text
                        .replace(/[#*`_\[\]]/g, '') // Remove Markdown
                        .replace(/\n\n/g, '。')      // Pause on paragraphs
                        .replace(/\n/g, '，')        // Pause on lines
                        .slice(0, 4000);             // Up to 4000 chars
                    
                    const base64Audio = await this.callGemini(cleanText, 'audio');
                    
                    const binaryString = window.atob(base64Audio);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const wavBlob = pcmToWav(bytes, 24000);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    const audio = new Audio(audioUrl);
                    
                    this.state.playingAudioId = id;
                    this.render(); 
                    
                    audio.play();
                    audio.onended = () => {
                        this.state.playingAudioId = null;
                        this.render();
                    };
                } catch (e) { alert(`語音生成失敗: ${e.message}`); }
                finally { this.setLoading(false); }

                                    </div>
                                    <div class="p-4 min-h-[200px] text-sm">
                                        <div id="content-ideas" class="prose prose-sm">${this.state.generatedReports[cKey] ? marked.parse(this.state.generatedReports[cKey]) : `<p class="text-slate-500 text-xs text-center py-8">產出短影音、社群策略</p>`}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            },

            createTrendCard(t) {
                // Defensive check for card rendering
                if (!t || !t.taxonomy || !t.metrics) return '';

                const isWatched = this.state.watchlist.includes(t.id);
                
                // Determine source tag color based on origin
                let sourceTag = '';
                if (t.origin === 'ai') {
                    sourceTag = `<span class="px-2 py-1 bg-purple-500/20 text-purple-300 border border-purple-500/30 text-[10px] font-bold uppercase rounded tracking-wider flex items-center gap-1 animate-pulse">
                        <i class="ph-bold ph-lightning"></i> Live Signal
                    </span>`;
                } else {
                    sourceTag = `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-[10px] font-bold uppercase rounded tracking-wider flex items-center gap-1">
                        <i class="ph-bold ph-user-circle"></i> 顧問精選
                    </span>`;
                }

                return `
                <div onclick="app.navigate('detail', '${t.id}')" class="glass-card bg-slate-900/40 p-5 rounded-xl border border-white/5 cursor-pointer group flex flex-col h-full relative overflow-hidden transition-all duration-300">
                    <div class="flex justify-between items-start mb-3 relative z-10">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-white/5 text-slate-300 border border-white/5 uppercase tracking-wide group-hover:border-gold-500/30 transition-colors">${t.taxonomy.industry}</span>
                        <div class="flex gap-1">
                            <button onclick="event.stopPropagation(); app.toggleWatchlist('${t.id}')" class="transition ${isWatched ? 'text-gold-400' : 'text-slate-500'} hover:text-gold-400"><i class="ph-fill ph-star text-lg"></i></button>
                            <button onclick="event.stopPropagation(); app.deleteTrend('${t.id}')" class="text-slate-500 hover:text-red-400 transition"><i class="ph-bold ph-trash text-lg"></i></button>
                        </div>
                    </div>
                    
                    <div class="mb-2">
                        ${sourceTag}
                    </div>

                    <h3 class="font-bold text-lg text-slate-100 mb-2 leading-tight group-hover:text-gold-400 transition-colors relative z-10">${t.title}</h3>
                    <p class="text-sm text-slate-400 line-clamp-3 mb-4 flex-1 relative z-10 font-light">${t.summary}</p>
                    <div class="border-t border-white/5 pt-3 flex justify-between items-center relative z-10 text-xs font-bold text-slate-500">
                        <span class="flex items-center gap-1"><i class="ph-fill ph-fire text-orange-500"></i> ${t.metrics.heat}</span>
                        <span class="text-[10px] text-slate-600 font-normal font-mono">${t.updated_at}</span>
                    </div>
                </div>`;
            }
        };
        app.init();
    </script>
</body>
</html>
